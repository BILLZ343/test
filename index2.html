<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Stok Sembako</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold"><i class=""></i>Toko Sembako</h1>
                <p class="text-xs text-blue-100">Stok Sembako</p>
            </div>
            <nav class="flex gap-2 bg-blue-700 p-1.5 rounded-lg">
                <button onclick="gantiTab('stok')" id="btn-stok" class="px-3 py-1.5 rounded text-sm font-medium bg-white text-blue-600 shadow-sm transition">Data Stok</button>
                <button onclick="gantiTab('transaksi')" id="btn-transaksi" class="px-3 py-1.5 rounded text-sm font-medium text-white hover:bg-blue-600 transition">Masuk / Keluar</button>
                <button onclick="gantiTab('laporan')" id="btn-laporan" class="px-3 py-1.5 rounded text-sm font-medium text-white hover:bg-blue-600 transition">Laporan</button>
            </nav>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        <div id="kotak-notif"></div>
        <section id="tab-stok" class="space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
                    <h2 class="text-lg font-bold text-gray-700">Daftar Barang Sembako</h2>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <input type="text" id="input-cari" onkeyup="cariBarang()" placeholder="Cari nama barang..."
                            class="px-3 py-2 border rounded-lg text-sm w-full sm:w-48 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="bukaModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap">
                            <i class="fa-solid fa-plus mr-1"></i> Tambah Barang
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600">
                                <th class="p-3">Nama Barang</th>
                                <th class="p-3">Kategori</th>
                                <th class="p-3">Harga (Rp)</th>
                                <th class="p-3 text-center">Stok</th>
                                <th class="p-3 text-center">Min Stok</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-stok-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </section>
        <section id="tab-transaksi" class="hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-emerald-600 mb-3 text-base"><i class="fa-solid fa-arrow-down mr-1"></i> Input Barang Masuk (Restock)</h3>
                    <form onsubmit="prosesTransaksi(event, 'masuk')" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Pilih Barang</label>
                            <select id="pilih-barang-masuk" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Jumlah Masuk</label>
                            <input type="number" id="jumlah-masuk" min="1" required placeholder="Contoh: 10" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Keterangan / Supplier</label>
                            <input type="text" id="ket-masuk" placeholder="Contoh: Toko Grosir Jaya" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition">
                            Simpan Barang Masuk
                        </button>
                    </form>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-rose-600 mb-3 text-base"><i class="fa-solid fa-arrow-up mr-1"></i> Input Barang Keluar (Terjual/Rusak)</h3>
                    <form onsubmit="prosesTransaksi(event, 'keluar')" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Pilih Barang</label>
                            <select id="pilih-barang-keluar" required class="w-full p-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-rose-500"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Jumlah Keluar</label>
                            <input type="number" id="jumlah-keluar" min="1" required placeholder="Contoh: 2" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Keterangan / Pembeli</label>
                            <input type="text" id="ket-keluar" placeholder="Contoh: Pembeli eceran" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg text-sm font-medium transition">
                            Simpan Barang Keluar
                        </button>
                    </form>
                </div>
            </div>
        </section>
        <section id="tab-laporan" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-700 text-base">Riwayat Aktivitas Barang (Masuk & Keluar)</h3>
                    <button onclick="resetDataSemua()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium">
                        Reset Data Awal
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600">
                                <th class="p-3">Waktu</th>
                                <th class="p-3">Nama Barang</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center">Jumlah</th>
                                <th class="p-3">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-laporan-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <div id="modal-barang" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 space-y-3 shadow-lg">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-700">Tambah Barang Baru</h3>
                <button onclick="tutupModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="simpanBarangBaru(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nama Barang</label>
                    <input type="text" id="tambah-nama" required placeholder="Contoh: Beras Ramos" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Kategori</label>
                    <input type="text" id="tambah-kategori" required placeholder="Contoh: Sembako Pokok" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Harga (Rp)</label>
                        <input type="number" id="tambah-harga" min="0" required placeholder="15000" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Stok Awal</label>
                        <input type="number" id="tambah-stok" min="0" required placeholder="10" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Batas Minimum Peringatan</label>
                    <input type="number" id="tambah-min" min="1" required placeholder="3" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="tutupModal()" class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-sm">Batal</button>
                    <button type="submit" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm font-medium">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="mixmax.js"></script>
</body>
</html>
